<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Riyaziyyat sınağı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Rubik:wght@500;600;700&display=swap">
<style>
/* VOICE: calm, exam-room serious, friendly for students and quick for the teacher
   IDEA: a squared school notebook page with a red margin line, checked in teacher's red pen
   PICTURE: the working sheet itself; results as an answer strip of numbered boxes
   COLOUR and TYPE: white paper, ink blue, red pen, green ticks; Rubik titles + Inter body
   LAYOUT: one centred column, big tap targets, phone first */
:root{--bg:#eef2f9;--paper:#fff;--ink:#101a3a;--mute:#5a6482;--line:#dbe3f2;--grid:rgba(40,90,200,.08);--red:#d7362b;--green:#178a4a;--blue:#1d4fd8;--soft:#f3f6fd;--redsoft:#fdecea;--greensoft:#e7f6ee;--amber:#9a6200;--ambersoft:#fff4dc}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1124;--paper:#131b35;--ink:#e8ecf8;--mute:#9aa4c2;--line:#26314f;--grid:rgba(140,170,255,.06);--red:#ff6b5e;--green:#4fd18a;--blue:#86a8ff;--soft:#1a2444;--redsoft:#3a1d22;--greensoft:#14322a;--amber:#ffc35c;--ambersoft:#3a2e14}}
:root[data-theme=dark]{--bg:#0b1124;--paper:#131b35;--ink:#e8ecf8;--mute:#9aa4c2;--line:#26314f;--grid:rgba(140,170,255,.06);--red:#ff6b5e;--green:#4fd18a;--blue:#86a8ff;--soft:#1a2444;--redsoft:#3a1d22;--greensoft:#14322a;--amber:#ffc35c;--ambersoft:#3a2e14}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:Rubik,Inter,sans-serif;line-height:1.1;margin:0;text-wrap:balance}
a{color:var(--blue)}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px max(4vw,16px);background:var(--ink);color:var(--paper)}
.top h1{font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{font:600 18px/1 Rubik,sans-serif;font-variant-numeric:tabular-nums;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.14);white-space:nowrap}
.timer.warn{background:var(--red);color:#fff}
.timer[hidden]{display:none}
main{padding:clamp(16px,4vw,40px) max(3vw,10px) 60px}
.sheet{max-width:760px;margin:0 auto;background:var(--paper);border-radius:14px;box-shadow:0 1px 0 var(--line),0 12px 40px -18px rgba(16,26,58,.35);padding:clamp(22px,5vw,44px) clamp(16px,5vw,44px) clamp(22px,5vw,44px) clamp(32px,7vw,64px);position:relative;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
.sheet::before{content:"";position:absolute;top:0;bottom:0;left:clamp(18px,4.5vw,42px);width:2px;background:var(--red);opacity:.55}
.title{font-size:clamp(28px,6vw,42px);font-weight:700}
.back{display:inline-block;margin-bottom:14px;font-weight:600;text-decoration:none;padding:6px 0}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 20px}
.meta span{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:500}
.rules{margin:0 0 24px;padding-left:20px;color:var(--mute)}
.rules li{margin:4px 0}.rules b{color:var(--ink)}
.form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
label{display:grid;gap:6px;font-size:14px;font-weight:600}
input,textarea{font:16px Inter,sans-serif;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;min-height:48px;width:100%}
textarea{resize:vertical;min-height:70px;line-height:1.45}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.full{grid-column:1/-1}
.btn{font:600 17px Rubik,sans-serif;background:var(--blue);color:#fff;border:0;border-radius:12px;min-height:52px;padding:12px 20px;width:100%;cursor:pointer;text-align:center;text-decoration:none;display:inline-grid;place-items:center;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--blue);border:1.5px solid var(--blue)}
.btn.sm{min-height:44px;font-size:15px;padding:8px 14px;width:auto}
.btn.danger{background:transparent;color:var(--red);border:1.5px solid var(--red)}
.err{color:var(--red);font-size:14px;min-height:20px;margin:0;font-weight:600}
.note{color:var(--mute);font-size:14px;margin:12px 0 0}
.center{text-align:center}
.prog{display:flex;align-items:center;gap:12px;font-weight:600;font-size:14px;color:var(--mute);margin-bottom:20px;white-space:nowrap}
.bar{flex:1;height:8px;background:var(--soft);border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--blue);border-radius:9px;transition:width .3s}
.qt{font-size:clamp(21px,4.6vw,29px);font-weight:600;margin-bottom:22px;white-space:pre-wrap}
.opts{display:grid;gap:10px;margin-bottom:20px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;font:500 18px Inter,sans-serif;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-height:56px;cursor:pointer}
.opt b{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);font:600 15px Rubik,sans-serif}
.opt.on{border-color:var(--blue);background:var(--soft);box-shadow:0 0 0 1px var(--blue)}
.opt.on b{background:var(--blue);border-color:var(--blue);color:#fff}
.alert{max-width:760px;margin:0 auto 14px;background:var(--redsoft);color:var(--red);border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px}
.who{color:var(--mute);font-weight:500;margin:8px 0 0}
.score{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin:20px 0 6px}
.score .big{font:700 clamp(56px,14vw,88px)/1 Rubik,sans-serif;color:var(--green)}
.score .big small{font-size:.38em;margin-left:6px}
.score .rest{font:600 20px Rubik,sans-serif}
.w{color:var(--red)}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin:20px 0 8px}
.strip span{display:grid;place-items:center;height:42px;border-radius:8px;font:600 15px Rubik,sans-serif;border:1.5px solid var(--line);color:var(--mute)}
.strip .ok{background:var(--greensoft);border-color:var(--green);color:var(--green)}
.strip .no{background:var(--redsoft);border-color:var(--red);color:var(--red)}
.legend{font-size:13px;color:var(--mute);margin:0 0 26px}
h3{font-size:22px;margin:8px 0 14px}
.ex{border-top:1px solid var(--line);padding:16px 0}
.ex .n{font-size:13px;font-weight:600;color:var(--mute)}
.ex p{margin:6px 0}
.ex .q{font-weight:600;font-size:17px;white-space:pre-wrap}
.ex .yours{color:var(--red)}
.ex .yours s{text-decoration-thickness:2px}
.ex .right{color:var(--green);font-weight:600}
.ex .why{background:var(--soft);border-left:3px solid var(--blue);padding:10px 12px;border-radius:0 8px 8px 0;margin-top:10px;white-space:pre-wrap}
.sent{font-size:14px;font-weight:600;padding:10px 14px;border-radius:10px;background:var(--soft);margin:0 0 6px}
.sent:empty{display:none}
.sent.ok{background:var(--greensoft);color:var(--green)}
.sent.bad{background:var(--redsoft);color:var(--red)}
hr{border:0;border-top:1px solid var(--line);margin:26px 0}
/* teacher */
.list{display:grid;gap:12px;margin:20px 0}
.card{border:1.5px solid var(--line);border-radius:12px;padding:14px;background:var(--paper)}
.card h4{margin:0 0 4px;font:600 19px Rubik,sans-serif}
.card .sub{color:var(--mute);font-size:14px;margin:0 0 12px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.qc{border:1.5px solid var(--line);border-radius:12px;padding:14px;margin:0 0 14px;background:var(--paper);display:grid;gap:10px}
.qh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.qh b{font:600 16px Rubik,sans-serif}
.qh .acts button{min-width:44px}
.ov{display:flex;align-items:center;gap:8px}
.ov input[type=radio]{width:24px;height:24px;min-height:0;flex:none;accent-color:var(--green)}
.ov input[type=text]{flex:1}
.ov.ok input[type=text]{border-color:var(--green);background:var(--greensoft)}
.hint{font-size:13px;color:var(--mute);margin:0}
.chk{display:flex;align-items:center;gap:10px;font-weight:500}
.chk input{width:22px;height:22px;min-height:0;flex:none}
.sym{position:sticky;top:58px;z-index:3;display:flex;gap:6px;overflow-x:auto;padding:8px 0;margin:10px 0;background:var(--paper)}
.sym button{flex:none;min-width:44px;height:44px;border:1.5px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);font:600 17px Inter,sans-serif;cursor:pointer}
.linkbox{word-break:break-all;background:var(--soft);border:1px dashed var(--line);border-radius:10px;padding:12px;font-size:13px;margin:10px 0;max-height:120px;overflow:auto}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:10px}
.live{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--mute);margin:10px 0}
.live i{width:10px;height:10px;border-radius:50%;background:var(--green);animation:pulse 1.6s infinite}
.live.bad i{background:var(--red);animation:none}
@keyframes pulse{50%{opacity:.25}}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0 20px}
.kpis div{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpis b{display:block;font:700 30px/1.1 Rubik,sans-serif}
.kpis span{font-size:13px;color:var(--mute)}
.st{border:1.5px solid var(--line);border-radius:12px;background:var(--paper);overflow:hidden}
.st summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px;align-items:center}
.st summary::-webkit-details-marker{display:none}
.st .nm{font:600 17px Rubik,sans-serif}
.st .inf{font-size:13px;color:var(--mute);grid-column:1}
.st .pc{grid-row:1/3;grid-column:2;font:700 24px Rubik,sans-serif;text-align:right;white-space:nowrap}
.st .pc small{display:block;font:500 12px Inter,sans-serif;color:var(--mute)}
.st.prog .pc{color:var(--amber);font-size:15px}
.st .body{padding:0 14px 14px;border-top:1px solid var(--line)}
.flag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--ambersoft);color:var(--amber);margin-left:6px}
.ans{display:grid;gap:6px;margin-top:10px;font-size:14px}
.ans div{padding:8px 10px;border-radius:8px;background:var(--soft)}
.ans .ok{background:var(--greensoft)}.ans .no{background:var(--redsoft)}
@media(max-width:600px){.form,.row{grid-template-columns:minmax(0,1fr)}.opt{font-size:17px}.kpis b{font-size:24px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><h1 id="hd">Sınaq</h1><div class="timer" id="timer" hidden>00:00</div></header>
<main><div id="warn"></div><div id="app"><section class="sheet"><p>Yüklənir…</p></section></div></main>
<script>
{
var NTFY = 'https://ntfy.sh/';
var SYM = ['²','³','√','π','·','×',':','−','±','°','≤','≥','≠','∠','△','½','¼','∞','₁','₂','ⁿ','(',')'];
var SAMPLE = {title:'Riyaziyyat sınağı', min:30, shuffle:true, qs:[
  {q:'3x − 7 = 11 tənliyini həll edin.', o:['x = 4','x = 6','x = 18','x = 5'], a:1, e:'3x = 11 + 7 = 18, buradan x = 18 : 3 = 6.'},
  {q:'2/3 + 3/4 cəmini tapın.', o:['5/7','5/12','17/12','6/7'], a:2, e:'Ortaq məxrəc 12-dir: 8/12 + 9/12 = 17/12. Surətlər və məxrəclər ayrı-ayrılıqda toplanmır.'},
  {q:'Hansı ədədin 25%-i 40-a bərabərdir?', o:['10','100','160','65'], a:2, e:'25% = 1/4. Ədədin dörddə biri 40-dırsa, ədəd 40 · 4 = 160-dır.'},
  {q:'Uzunluğu 8 sm, eni 5 sm olan düzbucaqlının perimetri neçədir?', o:['13 sm','26 sm','40 sm','20 sm'], a:1, e:'P = 2 · (a + b) = 2 · (8 + 5) = 26 sm. 40 isə sahədir (sm²).'},
  {q:'(−3)² − 2 · (−4) ifadəsinin qiymətini tapın.', o:['1','−17','17','−1'], a:2, e:'(−3)² = 9, 2 · (−4) = −8. 9 − (−8) = 9 + 8 = 17.'},
  {q:'√144 + √81 = ?', o:['15','21','225','25'], a:1, e:'√144 = 12, √81 = 9, cəmi 21. Kökləri toplamaq ədədləri toplayıb kök almaqla eyni deyil.'},
  {q:'Üçbucağın iki bucağı 50° və 60°-dir. Üçüncü bucağı tapın.', o:['70°','80°','110°','90°'], a:0, e:'Üçbucağın daxili bucaqlarının cəmi 180°-dir: 180° − 50° − 60° = 70°.'},
  {q:'2x + 5 > 13 bərabərsizliyini həll edin.', o:['x > 9','x < 4','x > 4','x > 8'], a:2, e:'2x > 8, buradan x > 4. Müsbət ədədə böləndə işarə dəyişmir.'},
  {q:'4; 7; 10; … ardıcıllığının 10-cu həddini tapın.', o:['31','34','40','28'], a:0, e:'d = 3. aₙ = a₁ + (n − 1) · d = 4 + 9 · 3 = 31.'},
  {q:'Qiyməti 200 AZN olan malın qiyməti 15% endirildi. Yeni qiymət neçədir?', o:['185 AZN','30 AZN','170 AZN','175 AZN'], a:2, e:'200-ün 15%-i = 30 AZN. 200 − 30 = 170 AZN.'}
]};

var app = document.getElementById('app'), timerEl = document.getElementById('timer'), warnEl = document.getElementById('warn'), hd = document.getElementById('hd');
var LET = 'ABCDEF';

/* ---------- köməkçilər ---------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function ls(k, v){ try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch(e){ return null; } }
function rid(n){ var a = new Uint8Array(n), s = ''; crypto.getRandomValues(a); for (var i = 0; i < n; i++) s += 'abcdefghijkmnpqrstuvwxyz23456789'[a[i] % 32]; return s; }
function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function range(n){ var r = []; for (var i = 0; i < n; i++) r.push(i); return r; }
function mmss(sec){ sec = Math.max(0, Math.round(sec)); return String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0'); }
function hm(t){ var d = new Date(t); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
function day(t){ var d = new Date(t); return String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + ' ' + hm(t); }
function b64u(u8){ var s = ''; for (var i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function ub64u(s){ s = s.replace(/-/g,'+').replace(/_/g,'/'); while (s.length % 4) s += '='; var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
function pack(obj){
  var bytes = new TextEncoder().encode(JSON.stringify(obj));
  if (!window.CompressionStream) return Promise.resolve('p' + b64u(bytes));
  return new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer().then(function(b){ return 'z' + b64u(new Uint8Array(b)); });
}
function unpack(str){
  var bytes = ub64u(str.slice(1));
  var p = str[0] === 'z' ? new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer().then(function(b){ return new Uint8Array(b); }) : Promise.resolve(bytes);
  return p.then(function(u){ return JSON.parse(new TextDecoder().decode(u)); });
}
function copy(text, btn){
  var done = function(){ var t = btn.textContent; btn.textContent = 'Kopyalandı ✓'; setTimeout(function(){ btn.textContent = t; }, 1800); };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done).catch(fallback); else fallback();
  function fallback(){ var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch(e){} ta.remove(); }
}
function base(){ return location.href.split('#')[0]; }

/* =====================================================================
   ŞAGİRD HİSSƏSİ
   ===================================================================== */
var Z = null, S = null, SKEY = '', tick = null, picked = null, busy = false, PREVIEW = false;

function left(){ return Z.m * 60 - (Date.now() - S.start) / 1000; }
function sSave(){ if (!PREVIEW) ls(SKEY, S); }
function who(){ return S.name + ' ' + S.surname; }
function score(){
  var c = 0, w = 0, b = 0;
  S.answers.forEach(function(x){ if (x[1] == null) b++; else if (x[1] === Z.q[x[0]].a) c++; else w++; });
  return {c:c, w:w, b:b, pct: Math.round(c / Z.q.length * 100)};
}
function publish(type){
  if (PREVIEW || !Z.k) return Promise.resolve(true);
  var r = score(), p = {v:1, type:type, qz:Z.i, sid:S.sid, n:S.name, sn:S.surname, c:S.cls, no:S.num, st:S.start, en:S.end || null, tb:S.tabs || 0, tu:!!S.timeUp};
  var line;
  if (type === 'end'){ p.ans = S.answers; p.r = [r.c, r.w, r.b]; line = '📝 ' + who() + ' (' + S.cls + ', №' + S.num + ') — ' + r.c + '/' + Z.q.length + ' düz, ' + r.pct + '%'; }
  else line = '🟢 ' + who() + ' (' + S.cls + ', №' + S.num + ') sınağa başladı';
  return fetch(NTFY + Z.k, {method:'POST', body: line + '\n§' + JSON.stringify(p)}).then(function(res){ return res.ok; }).catch(function(){ return false; });
}

function studentStart(z, preview){
  Z = z; PREVIEW = preview; SKEY = 'snq_s_' + Z.i;
  hd.textContent = Z.t; document.title = Z.t;
  S = PREVIEW ? null : ls(SKEY);
  if (S && S.end) { renderResult(); if (!S.sentEnd) sendEnd(); }
  else if (S && S.start){ if (left() <= 0) timeUp(); else { startTimer(); renderQ(); } }
  else renderStart();
}

function renderStart(){
  timerEl.hidden = true;
  app.innerHTML = '<section class="sheet">' +
    (PREVIEW ? '<p class="sent" style="margin-bottom:14px">Önizləmə rejimi: nəticə göndərilmir.</p>' : '') +
    '<h2 class="title">' + esc(Z.t) + '</h2>' +
    '<div class="meta"><span>' + Z.q.length + ' sual</span><span>' + Z.m + ' dəqiqə</span><span>Hər sualın bir düz cavabı var</span></div>' +
    '<ul class="rules">' +
      '<li><b>Cavabı təsdiqlədikdən sonra geri qayıtmaq olmur.</b></li>' +
      '<li>Səhifəni yeniləsəniz, qaldığınız sualdan davam edəcəksiniz.</li>' +
      '<li>Başqa proqrama və ya səhifəyə keçmək qeydə alınır və müəllimə bildirilir.</li>' +
      '<li>Vaxt bitəndə sınaq avtomatik tamamlanır, cavablanmamış suallar boş sayılır.</li>' +
    '</ul>' +
    '<form id="f" class="form" novalidate>' +
      '<label>Ad<input id="fn" autocomplete="given-name" maxlength="40"></label>' +
      '<label>Soyad<input id="ln" autocomplete="family-name" maxlength="40"></label>' +
      '<label>Sinif<input id="cl" placeholder="məs. 9A" maxlength="10"></label>' +
      '<label>Nömrə<input id="nm" inputmode="numeric" placeholder="Jurnal və ya telefon nömrəsi" maxlength="20"></label>' +
      '<p class="err full" id="er"></p>' +
      '<button class="btn full" type="submit">Sınağa başla</button>' +
    '</form></section>';
  $('f').onsubmit = function(ev){
    ev.preventDefault();
    var v = function(id){ return $(id).value.trim(); };
    var d = {name: v('fn'), surname: v('ln'), cls: v('cl'), num: v('nm')};
    if (!d.name || !d.surname || !d.cls || !d.num){ $('er').textContent = 'Zəhmət olmasa bütün xanaları doldurun.'; return; }
    var N = Z.q.length, order = Z.s ? shuffle(range(N)) : range(N), perm = {};
    order.forEach(function(qi){ var n = Z.q[qi].o.length; perm[qi] = Z.s ? shuffle(range(n)) : range(n); });
    S = {sid: rid(10), name:d.name, surname:d.surname, cls:d.cls, num:d.num, order:order, perm:perm, answers:[], start:Date.now(), end:null, tabs:0, sentEnd:false};

}

function renderQ(){
  var N = Z.q.length, i = S.answers.length;

  picked = null; busy = false;
  app.innerHTML = '<section class="sheet">' +
    '<div class="prog"><span>Sual ' + (i + 1) + ' / ' + N + '</span><div class="bar"><i style="width:' + (i / N * 100) + '%"></i></div></div>' +
    '<h2 class="qt">' + esc(q.q) + '</h2>' +
    '<div class="opts">' + S.perm[qi].map(function(oi, k){ return '<button type="button" class="opt" data-o="' + oi + '"><b>' + LET[k] + '</b><span>' + esc(q.o[oi]) + '</span></button>'; }).join('') + '</div>' +
    '<button class="btn" id="next" disabled>' + (i + 1 < N ? 'Təsdiqlə və növbəti sual' : 'Təsdiqlə və sınağı bitir') + '</button>' +
    '<p class="note center">Təsdiqlədikdən sonra bu suala qayıtmaq olmayacaq.</p></section>';
  var opts = app.querySelectorAll('.opt');
  opts.forEach(function(b){ b.onclick = function(){ picked = +b.dataset.o; opts.forEach(function(x){ x.classList.toggle('on', x === b); }); $('next').disabled = false; }; });
  $('next').onclick = function(){ if (picked == null || busy) return; busy = true; S.answers.push([qi, picked]); sSave(); renderQ(); };
  window.scrollTo(0, 0);
}

function startTimer(){
  timerEl.hidden = false; clearInterval(tick);
  var step = function(){ var l = left(); timerEl.textContent = mmss(l); timerEl.classList.toggle('warn', l < 60); if (l <= 0){ clearInterval(tick); timeUp(); } };
  step(); tick = setInterval(step, 1000);
}
function timeUp(){ while (S.answers.length < Z.q.length) S.answers.push([S.order[S.answers.length], null]); S.timeUp = true; sSave(); finish(); }
function finish(){
  clearInterval(tick); timerEl.hidden = true; warnEl.innerHTML = '';
  if (!S.end){ S.end = Date.now(); sSave(); }
  renderResult(); if (!S.sentEnd) sendEnd();
}
function sendEnd(){
  var el = $('sent');
  if (PREVIEW){ el.className = 'sent'; el.textContent = 'Önizləmə: nəticə göndərilmədi.'; return; }
  if (el){ el.className = 'sent'; el.textContent = 'Nəticə müəllimə göndərilir…'; }
  publish('end').then(function(ok){
    S.sentEnd = ok; sSave();

  });
}
function renderResult(){
  var r = score();
  var strip = S.answers.map(function(x, i){ var cls = x[1] == null ? '' : (x[1] === Z.q[x[0]].a ? 'ok' : 'no'); return '<span class="' + cls + '">' + (i + 1) + '</span>'; }).join('');
  var wrong = S.answers.map(function(x, i){ return {x:x, i:i}; }).filter(function(o){ return o.x[1] !== Z.q[o.x[0]].a; });
  var exp = wrong.map(function(o){
    var q = Z.q[o.x[0]];
    return '<div class="ex"><span class="n">Sual ' + (o.i + 1) + '</span><p class="q">' + esc(q.q) + '</p>' +
      '<p class="yours">Sizin cavab: ' + (o.x[1] == null ? 'cavab verilməyib' : '<s>' + esc(q.o[o.x[1]]) + '</s>') + '</p>' +

    '<div class="score"><span class="big">' + r.c + '<small>düz</small></span><span class="rest"><span class="w">' + r.w + ' səhv</span> · ' + r.b + ' boş · ' + r.pct + '%</span></div>' +
    (S.timeUp ? '<p class="note">Vaxt bitdiyi üçün sınaq avtomatik tamamlandı.</p>' : '') +

document.addEventListener('visibilitychange', function(){

var TKEY = 'snq_teacher', pollT = null;
function quizzes(){ return ls(TKEY) || []; }
function saveQuizzes(a){ ls(TKEY, a); }
function getQ(id){ return quizzes().filter(function(q){ return q.id === id; })[0]; }
function putQ(q){ var a = quizzes(), i = a.findIndex(function(x){ return x.id === q.id; }); if (i < 0) a.unshift(q); else a[i] = q; saveQuizzes(a); }
function results(id){ return ls('snq_r_' + id) || {}; }
function newQuiz(from){
  var src = from || {title:'Yeni sınaq', min:30, shuffle:true, qs:[]};
  var q = {id: rid(8), topic: 'snq-' + rid(16), title: src.title, min: src.min, shuffle: src.shuffle, created: Date.now(),
    qs: (src.qs.length ? src.qs : [{q:'', o:['','','',''], a:0, e:''}]).map(function(x){ var o = x.o.slice(); while (o.length < 4) o.push(''); return {q:x.q, o:o, a:x.a, e:x.e || ''}; })};
  putQ(q); return q;
}
function toLinkData(Q){
  return {i:Q.id, t:Q.title, m:Q.min, s:Q.shuffle ? 1 : 0, k:Q.topic, q:Q.qs.map(function(x){
    var idx = []; x.o.forEach(function(t, j){ if (t.trim()) idx.push(j); });
    return {q:x.q.trim(), o:idx.map(function(j){ return x.o[j].trim(); }), a:idx.indexOf(x.a), e:(x.e || '').trim()};
  })};
}
function validate(Q){
  if (!Q.title.trim()) return 'Sınağın adını yazın.';
  if (!(Q.min >= 1)) return 'Vaxtı dəqiqə ilə yazın.';
  if (!Q.qs.length) return 'Ən azı bir sual əlavə edin.';
  for (var i = 0; i < Q.qs.length; i++){
    var x = Q.qs[i], n = x.o.filter(function(t){ return t.trim(); }).length;
    if (!x.q.trim()) return (i + 1) + '-ci sualın mətni boşdur.';
    if (n < 2) return (i + 1) + '-ci sualda ən azı 2 variant olmalıdır.';
    if (!(x.o[x.a] || '').trim()) return (i + 1) + '-ci sualda düzgün cavabı seçin (yaşıl dairə).';
  }
  return '';
}

function teacherRoute(parts){
  clearInterval(pollT); timerEl.hidden = true; hd.textContent = 'Müəllim paneli'; document.title = 'Müəllim paneli';
  if (parts[0] === 'edit' && getQ(parts[1])) return renderEdit(parts[1]);
  if (parts[0] === 'link' && getQ(parts[1])) return renderLink(parts[1]);

function renderEdit(id){

        return '<details class="st" data-sid="' + x.sid + '"' + (open[x.sid] ? ' open' : '') + '><summary><span class="nm">' + esc(x.n + ' ' + x.sn) + flags + '</span>' +

          '<span class="inf">' + esc(x.c) + ' · № ' + esc(x.no) + ' · ' + day(x.en) + ' · ' + dur + ' dəq</span></summary>' +
          '<div class="body"><p class="hint" style="margin-top:10px">Suallar sizin redaktordakı nömrə ilə</p><div class="ans">' + det + '</div></div></details>';
      }).join('') + '</div>' : '<p class="note center" style="margin:30px 0">Hələ heç kim başlamayıb. Şagird sınağa girən kimi burada görünəcək.</p>');
    $('body').querySelectorAll('details[data-sid]').forEach(function(d){ d.ontoggle = function(){ open[d.dataset.sid] = d.open; }; });
  }
  function poll(){
    if (document.hidden) return;
    fetch(NTFY + Q.topic + '/json?poll=1&since=all').then(function(r){ if (!r.ok) throw 0; return r.text(); }).then(function(t){
      var changed = false;
      t.split('\n').forEach(function(l){
        if (!l.trim()) return; var m, p; try { m = JSON.parse(l); } catch(e){ return; }
        if (m.event !== 'message' || !m.message) return;
        var k = m.message.indexOf('\n§'); if (k < 0) return;
        try { p = JSON.parse(m.message.slice(k + 2)); } catch(e){ return; }
        if (!p || p.qz !== Q.id || !p.sid) return;
        var old = R[p.sid];
        if (old && old.type === 'end') return;
        if (old && old.type === p.type) return;
        R[p.sid] = p; changed = true;
      });
      if (changed){ ls('snq_r_' + id, R); draw(); }
      $('lv').className = 'live'; $('lv').lastChild.textContent = 'Canlı · son yoxlama ' + hm(Date.now());
    }).catch(function(){ $('lv').className = 'live bad'; $('lv').lastChild.textContent = 'İnternet yoxdur — saxlanmış nəticələr göstərilir'; });
  }
  draw(); poll(); pollT = setInterval(poll, 8000);
  $('cp').onclick = function(){
    var head = 'Ad\tSoyad\tSinif\tNömrə\tDüz\tSəhv\tBoş\tFaiz\tÇıxma\tBitirdi';
    copy(head + '\n' + rows().filter(function(x){ return x.type === 'end'; }).map(function(x){
      var tot = x.r[0] + x.r[1] + x.r[2]; return [x.n, x.sn, x.c, x.no, x.r[0], x.r[1], x.r[2], Math.round(x.r[0] / tot * 100) + '%', x.tb, day(x.en)].join('\t');
    }).join('\n'), this);
  };
}
document.addEventListener('visibilitychange', function(){ if (!document.hidden && /^#muellim\/res\//.test(location.hash)) { var b = $('lv'); if (b) b.lastChild.textContent = 'Yenilənir…'; } });

/* =====================================================================
   YÖNLƏNDİRMƏ
   ===================================================================== */
function route(){
  var h = location.hash.slice(1);
  if (h.indexOf('q=') === 0){
    if (Z) return;
    var hp = new URLSearchParams(h), d = hp.get('q');
    if (d[0] === 'z' && !window.DecompressionStream){ app.innerHTML = '<section class="sheet"><p class="err">Brauzeriniz köhnədir. Chrome-u yeniləyib linki yenidən açın.</p></section>'; return; }
    unpack(d).then(function(z){ studentStart(z, hp.get('pv') === '1'); })
      .catch(function(){ app.innerHTML = '<section class="sheet"><p class="err">Link xətalıdır. Müəllimdən linki yenidən istəyin.</p></section>'; });
    return;
  }
  if (h === 'setup' || h.indexOf('muellim') === 0) return teacherRoute(h.split('/').slice(1));
  hd.textContent = 'Sınaq';
  app.innerHTML = '<section class="sheet"><h2 class="title">Onlayn sınaq</h2><p class="who">Şagirdsinizsə, sınaq linkini müəlliminizdən alın.</p>' +
    '<a class="btn" style="margin-top:22px" href="#muellim">Müəllim paneli</a></section>';
}
window.addEventListener('hashchange', route);
route();
}
