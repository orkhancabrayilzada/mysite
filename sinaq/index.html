<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Onlayn sınaq</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Rubik:wght@500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><div class="bar1"><h1 id="hd">Onlayn sınaq</h1><div class="timer" id="timer" hidden>00:00</div></div></header>
<main><div id="warn"></div><div id="app"><section class="sheet"><p>Yüklənir…</p></section></div></main>
<script src="core.js"></script>
<script>
{
var U = SNQ, $ = U.$, esc = U.esc;
var app = $('app'), timerEl = $('timer'), warnEl = $('warn'), hd = $('hd');
var TOPIC = (location.hash.slice(1) || new URLSearchParams(location.search).get('k') || '').trim();
var PREVIEW = /[?&]pv=1/.test(location.search);
var Z = null, S = null, tick = null, picked = null, busy = false, retryT = null, waitT = null;

function key(id){ return 'snq_s_' + TOPIC + '_' + id; }
function save(){ if (!PREVIEW) U.ls(key(Z.id), S); }
function who(){ return S.name + ' ' + S.surname; }
function left(){ return Z.m * 60 - (Date.now() - S.start) / 1000; }
function correct(qi){ var q = Z.q[qi]; return U.reveal(Z.id, q.i, q.a, q.o.length); }
function score(){
  var c = 0, w = 0, b = 0;
  S.answers.forEach(function(x){ if (x[1] == null) b++; else if (x[1] === correct(x[0])) c++; else w++; });
  return {c:c, w:w, b:b, pct: Math.round(c / Z.q.length * 100)};
}
function sheet(html){ app.innerHTML = '<section class="sheet">' + html + '</section>'; window.scrollTo(0, 0); }

/* ---------- yükləmə ---------- */
function boot(){
  if (!TOPIC){ sheet('<h2 class="title">Link natamamdır</h2><p class="who">Sınaq linkini müəlliminizdən yenidən istəyin.</p>'); return; }
  if (!window.crypto || !crypto.subtle){ sheet('<h2 class="title">Brauzer uyğun deyil</h2><p class="who">Chrome və ya Safari-nin son versiyası ilə açın.</p>'); return; }
  if (PREVIEW && U.ls('snq_preview')){ Z = U.ls('snq_preview'); hd.textContent = Z.t; renderStart(); return; }
  var curId = U.ls('snq_cur_' + TOPIC), cur = curId && U.ls(key(curId));
  if (cur && !cur.end && !PREVIEW){ Z = cur.z; S = cur; resume(); return; }
  U.readChannel(TOPIC).then(U.activeQuiz).then(function(z){
    if (z && !PREVIEW){
      var s = U.ls(key(z.id));
      if (s && s.end){ Z = s.z; S = s; showResult(); return; }
    }
    if (z){ Z = z; hd.textContent = z.t; document.title = z.t; renderStart(); return; }
    if (cur && cur.end){ Z = cur.z; S = cur; showResult(); return; }
    renderWaiting();
  }).catch(function(){
    if (cur && cur.end){ Z = cur.z; S = cur; showResult(); return; }
    sheet('<h2 class="title">Bağlantı alınmadı</h2><p class="who">İnterneti yoxlayın. Səhifə özü yenidən cəhd edəcək.</p><button class="btn" style="margin-top:20px" id="rt">İndi yenidən yoxla</button>');
    $('rt').onclick = boot; clearTimeout(waitT); waitT = setTimeout(boot, 12000);
  });
}
function renderWaiting(){
  sheet('<div class="wait"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="50" fill="var(--soft)" stroke="var(--line)" stroke-width="3"/><path d="M60 30v32l20 12" stroke="var(--blue)" stroke-width="7" stroke-linecap="round" fill="none"/></svg>' +
    '<h2 class="title">Hazırda aktiv sınaq yoxdur</h2><p class="who">Müəllim sınağı açan kimi bu səhifə özü yenilənəcək.</p></div>');
  clearTimeout(waitT); waitT = setTimeout(boot, 20000);
}
function resume(){ hd.textContent = Z.t; document.title = Z.t; if (left() <= 0) timeUp(); else { startTimer(); renderQ(); flush(); } }
function showResult(){ hd.textContent = Z.t; document.title = Z.t; renderResult(); flush(); }

/* ---------- müəllimə göndərmə (növbə ilə, uğursuz olsa təkrar) ---------- */
function payload(type){
  var p = {type:type, qz:Z.id, sid:S.sid, n:S.name, sn:S.surname, c:S.cls, no:S.num, st:S.start, en:S.end || null, tb:S.tabs || 0, tu:!!S.timeUp};
  if (type === 'end'){
    var r = score(); p.r = [r.c, r.w, r.b];
    p.ans = S.answers.map(function(x){ var q = Z.q[x[0]], k = correct(x[0]); return [x[0] + 1, q.q.slice(0, 140), x[1] == null ? null : q.o[x[1]], q.o[k], x[1] === k ? 1 : 0]; });
  }
  return p;
}
function send(type){ return U.seal(Z.pk, payload(type)).then(function(s){ return U.publish(TOPIC, 'R', s); }).catch(function(){ return false; }); }
function flush(){
  if (PREVIEW || !S) return;
  clearTimeout(retryT);
  var job = !S.sentStart ? 'start' : (S.end && !S.sentEnd ? 'end' : null);
  if (!job) return status();
  status();
  send(job).then(function(ok){
    if (ok){ if (job === 'start') S.sentStart = true; else S.sentEnd = true; save(); flush(); }
    else { status(); retryT = setTimeout(flush, 15000); }
  });
}
function status(){
  var e = $('sent'); if (!e || !S.end) return;
  if (PREVIEW){ e.className = 'sent'; e.textContent = 'Önizləmə: nəticə müəllimə göndərilmir.'; return; }
  if (S.sentEnd){ e.className = 'sent ok'; e.textContent = '✓ Nəticəniz müəllimə göndərildi.'; }
  else { e.className = 'sent bad'; e.textContent = 'Nəticə göndərilir… İnternet yoxdursa, səhifəni bağlamayın — özü təkrar cəhd edir.'; }
}
window.addEventListener('online', flush);

/* ---------- giriş ---------- */
function renderStart(){
  timerEl.hidden = true;
  sheet((PREVIEW ? '<p class="sent" style="margin-bottom:14px">Önizləmə rejimi: nəticə göndərilmir.</p>' : '') +
    '<h2 class="title">' + esc(Z.t) + '</h2>' +
    '<div class="meta"><span>' + Z.q.length + ' sual</span><span>' + Z.m + ' dəqiqə</span><span>Hər sualın bir düz cavabı var</span></div>' +
    '<ul class="rules"><li><b>Cavabı təsdiqlədikdən sonra geri qayıtmaq olmur.</b></li>' +
    '<li>Səhifəni yeniləsəniz, qaldığınız sualdan davam edəcəksiniz. Vaxt dayanmır.</li>' +
    '<li>Başqa proqrama və ya səhifəyə keçmək qeydə alınır və müəllimə bildirilir.</li>' +
    '<li>Vaxt bitəndə sınaq avtomatik tamamlanır, cavablanmamış suallar boş sayılır.</li></ul>' +
    '<form id="f" class="form" novalidate>' +
    '<label>Ad<input id="fn" autocomplete="given-name" maxlength="40"></label>' +
    '<label>Soyad<input id="ln" autocomplete="family-name" maxlength="40"></label>' +
    '<label>Sinif<input id="cl" placeholder="məs. 9A" maxlength="10"></label>' +
    '<label>Nömrə<input id="nm" inputmode="numeric" placeholder="Jurnal və ya telefon nömrəsi" maxlength="20"></label>' +
    '<p class="err full" id="er"></p><button class="btn full" type="submit">Sınağa başla</button></form>');
  $('f').onsubmit = function(ev){
    ev.preventDefault();
    var v = function(id){ return $(id).value.trim(); };
    var d = {name:v('fn'), surname:v('ln'), cls:v('cl'), num:v('nm')};
    if (!d.name || !d.surname || !d.cls || !d.num){ $('er').textContent = 'Zəhmət olmasa bütün xanaları doldurun.'; return; }
    var N = Z.q.length, order = Z.s ? U.shuffle(U.range(N)) : U.range(N), perm = {};
    order.forEach(function(qi){ var n = Z.q[qi].o.length; perm[qi] = Z.s ? U.shuffle(U.range(n)) : U.range(n); });
    S = {sid:U.rid(10), name:d.name, surname:d.surname, cls:d.cls, num:d.num, order:order, perm:perm, answers:[], start:Date.now(), end:null, tabs:0, sentStart:false, sentEnd:false, z:Z};
    if (!PREVIEW){ save(); U.ls('snq_cur_' + TOPIC, Z.id); }
    startTimer(); renderQ(); flush();
  };
}

/* ---------- suallar ---------- */
function renderQ(){
  var N = Z.q.length, i = S.answers.length;
  if (i >= N) return finish();
  var qi = S.order[i], q = Z.q[qi];
  picked = null; busy = false;
  sheet('<div class="prog"><span>Sual ' + (i + 1) + ' / ' + N + '</span><div class="pbar"><i style="width:' + (i / N * 100) + '%"></i></div></div>' +
    '<h2 class="qt">' + esc(q.q) + '</h2>' +
    '<div class="opts">' + S.perm[qi].map(function(oi, k){ return '<button type="button" class="opt" data-o="' + oi + '"><b>' + U.LET[k] + '</b><span>' + esc(q.o[oi]) + '</span></button>'; }).join('') + '</div>' +
    '<button class="btn" id="next" disabled>' + (i + 1 < N ? 'Təsdiqlə və növbəti sual' : 'Təsdiqlə və sınağı bitir') + '</button>' +
    '<p class="note center">Təsdiqlədikdən sonra bu suala qayıtmaq olmayacaq.</p>');
  var opts = app.querySelectorAll('.opt');
  opts.forEach(function(b){ b.onclick = function(){ picked = +b.dataset.o; opts.forEach(function(x){ x.classList.toggle('on', x === b); }); $('next').disabled = false; }; });
  $('next').onclick = function(){ if (picked == null || busy) return; busy = true; S.answers.push([qi, picked]); save(); renderQ(); };
}
function startTimer(){
  timerEl.hidden = false; clearInterval(tick);
  var step = function(){ var l = left(); timerEl.textContent = U.mmss(l); timerEl.classList.toggle('warn', l < 60); if (l <= 0){ clearInterval(tick); timeUp(); } };
  step(); tick = setInterval(step, 1000);
}
function timeUp(){ while (S.answers.length < Z.q.length) S.answers.push([S.order[S.answers.length], null]); S.timeUp = true; save(); finish(); }
function finish(){
  clearInterval(tick); timerEl.hidden = true; warnEl.innerHTML = '';
  if (!S.end){ S.end = Date.now(); save(); }
  renderResult(); flush();
}

/* ---------- nəticə və izahlar ---------- */
function renderResult(){
  var r = score();
  var strip = S.answers.map(function(x, i){ var c = x[1] == null ? '' : (x[1] === correct(x[0]) ? 'ok' : 'no'); return '<span class="' + c + '">' + (i + 1) + '</span>'; }).join('');
  var wrong = S.answers.map(function(x, i){ return {x:x, i:i}; }).filter(function(o){ return o.x[1] !== correct(o.x[0]); });
  var exp = wrong.map(function(o){
    var q = Z.q[o.x[0]];
    return '<div class="ex"><span class="n">Sual ' + (o.i + 1) + '</span><p class="q">' + esc(q.q) + '</p>' +
      '<p class="yours">Sizin cavab: ' + (o.x[1] == null ? 'cavab verilməyib' : '<s>' + esc(q.o[o.x[1]]) + '</s>') + '</p>' +
      '<p class="right">Düzgün cavab: ' + esc(q.o[correct(o.x[0])]) + '</p>' + (q.e ? '<p class="why">' + esc(q.e) + '</p>' : '') + '</div>';
  }).join('');
  sheet('<h2 class="title">Nəticəniz</h2>' +
    '<p class="who">' + esc(who()) + ' · ' + esc(S.cls) + ' sinif · № ' + esc(S.num) + '</p>' +
    '<div class="score"><span class="big">' + r.c + '<small>düz</small></span><span class="rest"><span class="w">' + r.w + ' səhv</span> · ' + r.b + ' boş · ' + r.pct + '%</span></div>' +
    (S.timeUp ? '<p class="note">Vaxt bitdiyi üçün sınaq avtomatik tamamlandı.</p>' : '') +
    '<div class="strip">' + strip + '</div><p class="legend">Yaşıl — düz, qırmızı — səhv, boz — cavabsız.</p>' +
    '<p class="sent" id="sent"></p>' +
    '<hr><h3>' + (wrong.length ? 'Səhvlərin izahı' : 'Təbriklər! Bütün cavablar düzdür.') + '</h3>' + exp);
  status();
}

/* ---------- saxtakarlığa qarşı ---------- */
document.addEventListener('visibilitychange', function(){
  if (!S || !S.start || S.end) return;
  if (document.hidden){ S.tabs = (S.tabs || 0) + 1; save(); }
  else warnEl.innerHTML = '<div class="alert">Diqqət: sınaq səhifəsindən çıxdınız (' + S.tabs + ' dəfə). Bu, müəllimə bildiriləcək.</div>';
});

boot();
}
</script>
</body>
</html>
